<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0F" />
    <meta
      name="description"
      content="porsecommerce — considered objects for everyday living."
    />
    <title>porsecommerce — Shop</title>

    <!-- Google Fonts: preconnect first so the font files start downloading sooner -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Three Google Fonts, each with a job:
      DM Sans       → body / UI text (warm, highly legible, Apple-like)
      Sora          → headlines (modern geometric with real personality)
      Space Grotesk → prices, badges and numbers (distinctive tech character)
      display=swap  → text shows immediately in a fallback font, then swaps when ready
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
